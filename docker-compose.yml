services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portuhub_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: portuhub
      DB_USERNAME: portuhubadmin
      DB_PASSWORD: Kj9s&5@2&8z1!
    command: bash -lc "php artisan config:clear && php artisan route:clear && composer install && [ -f .env ] || cp .env.example .env && php artisan key:generate --force && php artisan migrate --seed --force && php artisan storage:link && php artisan serve --no-reload --host=0.0.0.0 --port=8000"
    depends_on:
      node:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: portuhub_mysql
    environment:
      MYSQL_DATABASE: portuhub
      MYSQL_USER: portuhubadmin
      MYSQL_PASSWORD: Kj9s&5@2&8z1!
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - portuhub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  node:
    image: node:20
    container_name: portuhub_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    command: bash -lc "[ -d node_modules ] || npm ci && npm run dev"

volumes:
  portuhub_mysql_data:
