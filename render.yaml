# Render Blueprint: https://render.com/docs/blueprint-spec
databases:
  - name: portuhub-db
    databaseName: portuhub
    user: portuhub
    plan: free

services:
  - type: web
    name: portuhub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      # Discrete vars are more reliable than connectionString alone in Docker.
      - key: DB_HOST
        fromDatabase:
          name: portuhub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: portuhub-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: portuhub-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: portuhub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: portuhub-db
          property: password
      - key: DB_SSLMODE
        value: require
      - key: DB_URL
        fromDatabase:
          name: portuhub-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: portuhub-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
